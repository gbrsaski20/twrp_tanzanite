# tanzanite_oc configuration
# Edit this file before flashing, or later at
#   /data/adb/modules/tanzanite_oc/config.conf
# and reboot.

# --- enable / disable each part ---------------------------------------------
ENABLE_CPU=1
ENABLE_GPU=1

# --- CPU ---------------------------------------------------------------------
# Cluster C0 = little (Cortex-A55, stock 2000 MHz)
# Cluster C1 = big    (Cortex-A76, stock 2200 MHz)
#
# Voltage must be high enough for the clock. Too low = instant hang,
# too high = unnecessary heat and silicon wear. Raise in 25 mV steps only.
A55_MHZ=2300
A55_MV=950

A76_MHZ=2500
A76_MV=1100

# Safer starting point if the values above turn out unstable:
#   A55_MHZ=2200  A55_MV=900
#   A76_MHZ=2350  A76_MV=1050

# --- GPU ---------------------------------------------------------------------
# Stock top OPP is 1100000 KHz @ 900 mV.
#   1150000 / 930  = +4.5%   (recommended)
#   1200000 / 960  = +9%
#   1250000 / 1000 = +14%    (experimental)
GPU_KHZ=1150000
GPU_MV=930

# --- guards ------------------------------------------------------------------
# Do not apply if the battery is below this percentage.
MIN_BATTERY=20
# Do not apply if the battery temperature is above this (degrees C).
MAX_TEMP=42
# Wait this many seconds after boot before touching anything, so the system
# is settled and a hang does not look like a bootloop.
DELAY=90
# After this many boots in a row without a successful apply, the module
# disables itself. Set to 0 to disable this protection (not recommended).
MAX_FAILED_BOOTS=2
